name: 3D probe (temporary)

# one-off: print the contribution calendar contrib3d.py draws, then delete
on:
  push:
    branches:
      - claude/loving-ritchie-bi8epw
    paths:
      - .github/workflows/contrib3d-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # the same daily counts the public profile already shows
      - name: Print the calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTRIB3D_USER: ${{ github.repository_owner }}
        run: python3 -I .github/scripts/contrib3d.py --json
