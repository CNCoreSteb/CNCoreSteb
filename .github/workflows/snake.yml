name: generate animation

on:
  # every 2 hours (minute 7 avoids the busy top of the hour)
  schedule:
    - cron: "7 */2 * * *"
  # manual run
  workflow_dispatch:
  # every push to master
  push:
    branches:
      - master

# nothing by default; the job below asks only for what it needs
permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the SVGs to the `output` branch
    steps:
      # the only external action: GitHub's own checkout, pinned to a commit
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # stdlib-only Python already on the runner: no pip, no third-party code
      - name: Generate snake SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAKE_USER: ${{ github.repository_owner }}
        run: python3 -I .github/scripts/snake.py "$RUNNER_TEMP/snake"

      # same result as before: the output branch holds just these two files
      - name: Push to the output branch
        working-directory: ${{ runner.temp }}/snake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update snake animation"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:output
