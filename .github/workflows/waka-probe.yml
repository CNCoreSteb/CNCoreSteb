name: WakaTime probe (temporary)

# one-off: see what the WakaTime API returns for this account, then delete
on:
  push:
    branches:
      - claude/loving-ritchie-bi8epw
    paths:
      - .github/workflows/waka-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # logs are public: print names and durations only, never projects, machines or raw JSON
      - name: Probe the WakaTime API
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python3 -I - <<'EOF'
          import base64, json, os, time, urllib.error, urllib.request

          KEY = os.environ["WAKATIME_API_KEY"].strip()
          AUTH = "Basic " + base64.b64encode(KEY.encode()).decode()
          BASE = "https://wakatime.com/api/v1"

          def get(path):
              req = urllib.request.Request(BASE + path, headers={"Authorization": AUTH, "User-Agent": "waka-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      body = json.load(e)
                  except ValueError:
                      body = {}
                  return e.code, body

          def hm(s):
              m = int(round(float(s or 0) / 60))
              return f"{m // 60}h {m % 60:02d}m"

          def rows(items, n=12):
              for it in (items or [])[:n]:
                  print(f"    {str(it.get('name'))[:24]:<24} {hm(it.get('total_seconds')):>9}  {float(it.get('percent') or 0):5.1f}%")
              if len(items or []) > n:
                  print(f"    ... {len(items) - n} more")

          for rng in ("last_7_days", "last_30_days", "last_6_months", "last_year", "all_time"):
              print(f"\n===== stats/{rng}")
              for attempt in range(4):
                  code, body = get(f"/users/current/stats/{rng}")
                  d = (body or {}).get("data") or {}
                  if code == 200 and d.get("is_up_to_date") is not False:
                      break
                  if code not in (200, 202):
                      break
                  time.sleep(15)
              print(f"  HTTP {code}  error={body.get('error')!r}" if code != 200 else f"  HTTP 200")
              if code != 200:
                  continue
              print("  keys:", ", ".join(sorted(d)))
              for k in ("status", "is_up_to_date", "percent_calculated", "range", "human_readable_range",
                        "start", "end", "days_including_holidays", "days_minus_holidays", "holidays",
                        "is_coding_activity_visible", "is_other_usage_visible", "is_including_today",
                        "writes_only", "timeout"):
                  if k in d:
                      print(f"  {k}: {d[k]!r}")
              print("  total:", hm(d.get("total_seconds")), "| incl. other language:", hm(d.get("total_seconds_including_other_language")),
                    "| daily avg:", hm(d.get("daily_average")))
              bd = d.get("best_day") or {}
              print("  best_day:", bd.get("date"), hm(bd.get("total_seconds")))
              for k in ("languages", "editors", "operating_systems", "categories"):
                  print(f"  {k}: ({len(d.get(k) or [])})")
                  rows(d.get(k))
              for k in ("projects", "machines", "dependencies"):
                  print(f"  {k}: {len(d.get(k) or [])} entries (names not printed)")

          print("\n===== summaries?range=last_7_days (per day)")
          code, body = get("/users/current/summaries?range=last_7_days")
          print(f"  HTTP {code}")
          for day in (body.get("data") or []):
              gt = day.get("grand_total") or {}
              print(f"    {(day.get('range') or {}).get('date')}  {hm(gt.get('total_seconds'))}")

          print("\n===== all_time_since_today")
          code, body = get("/users/current/all_time_since_today")
          d = (body or {}).get("data") or {}
          print(f"  HTTP {code}  total={hm(d.get('total_seconds'))}  daily_avg={hm(d.get('daily_average'))}  "
                f"up_to_date={d.get('is_up_to_date')}  since={(d.get('range') or {}).get('start_date')}")
          EOF
