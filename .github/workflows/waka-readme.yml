name: WakaTime README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # daily 00:00 UTC = 10:00 Brisbane

# nothing by default; the job below asks only for what it needs
permissions: {}

concurrency:
  group: waka-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit the stats block in README.md to main
    steps:
      # pinned to the master commit this workflow was already running
      - name: Update the stats block
        uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9 # master, waka-readme 0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
