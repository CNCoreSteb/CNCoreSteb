name: 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # daily 18:00 UTC = 04:00 Brisbane
  workflow_dispatch:

# nothing by default; the job below asks only for what it needs
permissions: {}

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit the SVGs in profile-3d-contrib/ to main
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8 # 0.7.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      # skip the commit when nothing changed, so the run stays green
      - name: Commit & push
        run: |
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update 3D contribution graphs"
          git push -q
