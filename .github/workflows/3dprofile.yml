name: 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # daily 18:00 UTC = 04:00 Brisbane
  workflow_dispatch:
  # redraw straight away when this workflow changes
  push:
    branches:
      - main
    paths:
      - .github/workflows/3dprofile.yml

# nothing by default; the job below asks only for what it needs
permissions: {}

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the picked SVGs to the `3d` branch
    steps:
      # renders all ten styles into ./profile-3d-contrib
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8 # 0.7.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      # one random light style and one random dark style; the README picks by theme
      - name: Pick today's styles
        working-directory: profile-3d-contrib
        run: |
          light=$(shuf -n1 -e profile-green-animate.svg profile-south-season-animate.svg profile-gitblock.svg)
          dark=$(shuf -n1 -e profile-night-view.svg profile-night-green.svg profile-night-rainbow.svg)
          mkdir -p "$RUNNER_TEMP/3d"
          cp "$light" "$RUNNER_TEMP/3d/3d-light.svg"
          cp "$dark" "$RUNNER_TEMP/3d/3d-dark.svg"
          echo "PICKED=${light%.svg}, ${dark%.svg}" >> "$GITHUB_ENV"
          echo "light: \`$light\` · dark: \`$dark\`" >> "$GITHUB_STEP_SUMMARY"

      # force-push a single commit to an orphan branch, so main never gets bot commits
      - name: Push to the 3d branch
        working-directory: ${{ runner.temp }}/3d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b 3d
          git add 3d-light.svg 3d-dark.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update 3D contribution graphs ($PICKED)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:3d
