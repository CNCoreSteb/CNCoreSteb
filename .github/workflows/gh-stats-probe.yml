name: GitHub Stats probe (temporary)

# one-off: print the numbers gh_stats.py would draw, then delete
on:
  push:
    branches:
      - claude/loving-ritchie-bi8epw
    paths:
      - .github/workflows/gh-stats-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # aggregates only: counts, dates and language totals, never repository names
      - name: Print the stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
          STATS_USER: ${{ github.repository_owner }}
        run: |
          echo "STATS_TOKEN set: $HAS_STATS_TOKEN"
          python3 -I .github/scripts/gh_stats.py --json
